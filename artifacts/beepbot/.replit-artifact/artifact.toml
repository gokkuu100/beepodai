kind = "web"
previewPath = "/"
title = "BeePod"
description = "BeePod is a kid-safe AI companion robot that talks, listens, teaches, and grows with children through natural voice conversations. Families can join the pre-order list and explore the product."
version = "1.0.0"
id = "artifacts/beepbot"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19331

[services.development]
run = "pnpm --filter @workspace/beepbot run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/beepbot", "run", "build" ]
serve = "static"
publicDir = "artifacts/beepbot/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19331"
BASE_PATH = "/"
